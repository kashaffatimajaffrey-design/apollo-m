<text x="665.0" y="372" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">explain(metrics)  — narration only</text>
<line x1="990" y1="416" x2="340" y2="416" stroke="#12142b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="665.0" y="408" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">analyst briefing text</text>
<line x1="320" y1="452" x2="120" y2="452" stroke="#12142b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="220.0" y="444" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">render metrics, forecast band, briefing</text>
<rect x="60" y="496" width="1060" height="96" rx="9" fill="#f7f8fb" stroke="#c9cee0" stroke-width="1.4"/>
<text x="80" y="524" font-size="12.5" fill="#12142b" font-weight="bold" text-anchor="start">The ordering encodes the project's governing principle</text>
<text x="80" y="548" font-size="12" fill="#5b6178" font-weight="normal" text-anchor="start">Every number reaching the user is read from storage before the language model is contacted. The LLM receives</text>
<text x="80" y="568" font-size="12" fill="#5b6178" font-weight="normal" text-anchor="start">already-computed metrics and returns prose; if it is unavailable a deterministic template is substituted and the</text>
