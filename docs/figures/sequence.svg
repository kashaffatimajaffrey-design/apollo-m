<line x1="340" y1="226" x2="540" y2="226" stroke="#12142b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="440.0" y="218" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">GET /communities/{sub}  (JWT)</text>
<line x1="560" y1="262" x2="760" y2="262" stroke="#12142b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="660.0" y="254" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">SELECT … FROM community_health</text>
<line x1="760" y1="298" x2="560" y2="298" stroke="#12142b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="660.0" y="290" font-size="11" fill="#12142b" font-weight="normal" text-anchor="middle">row: CHI, toxicity, churn, cluster</text>
