<line x1="770" y1="146" x2="770" y2="566" stroke="#c9cee0" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="912" y="106" width="176" height="38" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="1000" y="130" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="middle">Claude (LLM)</text>
