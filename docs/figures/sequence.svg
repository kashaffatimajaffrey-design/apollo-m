<text x="330" y="130" font-size="12.5" fill="#12805c" font-weight="bold" text-anchor="middle">Dashboard</text>
<line x1="330" y1="146" x2="330" y2="566" stroke="#c9cee0" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="462" y="106" width="176" height="38" rx="8" fill="#ffffff" stroke="#5b3fbf" stroke-width="1.5"/>
