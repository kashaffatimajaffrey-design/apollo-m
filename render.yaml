# Render blueprint for the APOLLO-M backend.
#
# Deploys the read-only serving API only. Training (toxic-bert, the TFT, the
# embedder) stays local: those need torch and several GB of RAM, while the
# deployed service just reads precomputed results out of PostgreSQL. That split
# is why requirements-serve.txt exists and why this builds on the free tier.
#
# NO SECRETS IN THIS FILE. It is committed to a public repository. Values marked
# sync:false are entered in the Render dashboard's Environment tab, which stores
# them encrypted; the database URL is injected by Render from the managed
# instance below.
services:
  - type: web
    name: apollo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Makes api/auth.py refuse to start if JWT_SECRET is missing, rather than
      # falling back to an ephemeral key. A deployed API that silently accepts a
      # predictable signing key is worse than one that fails loudly on boot.
      - key: ENVIRONMENT
        value: production
      # Apollo shares CEREBRO's PostgreSQL rather than provisioning its own.
      # Render's free tier permits one free database per account and CEREBRO
      # already holds it, but this is not merely a workaround: a single instance
      # serving both systems is the deployed form of the shared-database
      # integration described in the technical report, and it mirrors the local
      # setup exactly.
      #
      # Paste cerebro-db's INTERNAL connection string here (Render dashboard ->
      # cerebro-db -> Internal Database URL). Internal, not external: both
      # services run inside the same Render network, so traffic never leaves it.
      # Apollo's tables live in the `apollo` schema, CEREBRO's in `cerebro`.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: apollo
      # Set in the Render dashboard, never here.
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: LLM_PROVIDER
        value: claude
      # Lets the deployed dashboard and CEREBRO call this API cross-origin.
      - key: CORS_ORIGINS
        sync: false

# No `databases:` block on purpose — see DATABASE_URL above. Declaring one here
# fails with "cannot have more than one active free tier database" because
# cerebro-db already occupies that slot, and it would cancel the web service
# along with it.
