name: Web

# The Next.js surface in web/. Scoped with paths so a change to the Python
# pipeline does not spend CI minutes rebuilding a frontend it cannot affect.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

# Deliberately runs with no Supabase secrets. Every check here has to pass on a
# clone with nothing configured, which is also the guarantee that someone can
# get the app running before they have credentials.
#
# No `cache: npm` on setup-node. It saves ~/.npm in a post step even when the
# job failed, and restores through prefix keys, so a cache written during an
# early broken run outlives the lockfile change that should have invalidated it.
# A clean install takes about twenty seconds; that is cheaper than a cache that
# can make runs fail for a reason nothing in the repository explains.

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Preflight
        run: |
          echo "pwd: $(pwd)"
          echo "node: $(node -v)  npm: $(npm -v)"
          ls -la package.json package-lock.json
      - name: Install
        # Job logs need admin rights on the repository to download, but check-run
        # annotations are public. Republishing the failure as an annotation is
        # what lets this be diagnosed by anyone who can see the repository rather
        # than only by its owner.
        run: |
          set +e
          npm ci > install.out 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "----- npm output -----"
            cat install.out
            echo "----- npm debug log (tail) -----"
            tail -n 40 "$HOME"/.npm/_logs/*.log 2>/dev/null || echo "(none written)"
            msg=$(grep -E "npm (error|ERR)" install.out | head -n 12 | paste -sd ' ' - | cut -c1-800)
            if [ -z "$msg" ]; then
              msg=$(tail -n 12 install.out | paste -sd ' ' - | cut -c1-800)
            fi
            echo "::error title=npm ci failed::${msg}"
            exit "$code"
          fi
      - name: Type safety
        run: npx tsc --noEmit
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Preflight
        run: |
          echo "pwd: $(pwd)"
          echo "node: $(node -v)  npm: $(npm -v)"
          ls -la package.json package-lock.json
      - name: Install
        run: |
          set +e
          npm ci > install.out 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "----- npm output -----"
            cat install.out
            echo "----- npm debug log (tail) -----"
            tail -n 40 "$HOME"/.npm/_logs/*.log 2>/dev/null || echo "(none written)"
            msg=$(grep -E "npm (error|ERR)" install.out | head -n 12 | paste -sd ' ' - | cut -c1-800)
            if [ -z "$msg" ]; then
              msg=$(tail -n 12 install.out | paste -sd ' ' - | cut -c1-800)
            fi
            echo "::error title=npm ci failed::${msg}"
            exit "$code"
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: playwright-report, path: web/playwright-report, retention-days: 7}
