name: Web

# The Next.js surface in web/. Scoped with paths so a change to the Python
# pipeline does not spend CI minutes rebuilding a frontend it cannot affect.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

# Deliberately runs with no Supabase secrets. Every check here has to pass on a
# clone with nothing configured, which is also the guarantee that someone can
# get the app running before they have credentials.
#
# Runs #1-#8 all failed at `npm ci`. The cause was not the working directory:
# package.json had been renamed to apollo-m-web while package-lock.json still
# carried the old apollo-watch name, and `npm ci` refuses to install when the
# two disagree -- including on the name field, not just on dependencies. The
# lockfile is regenerated and `npm ci` verified locally.
#
# working-directory is kept per job rather than at workflow level because it is
# the form hardest to get wrong, and Preflight prints where it is and what it
# can see, so the next failure of this kind is legible in the log instead of
# needing the repository to reproduce it.
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Preflight — prove where we are before npm runs
        run: |
          echo "pwd: $(pwd)"
          echo "node: $(node -v)  npm: $(npm -v)"
          ls -la package.json package-lock.json
      - name: Install
        run: npm ci || (echo "----- npm debug log -----"; cat "$HOME/.npm/_logs/"*.log; exit 1)
      - name: Type safety
        run: npx tsc --noEmit
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Preflight — prove where we are before npm runs
        run: |
          echo "pwd: $(pwd)"
          echo "node: $(node -v)  npm: $(npm -v)"
          ls -la package.json package-lock.json
      - name: Install
        run: npm ci || (echo "----- npm debug log -----"; cat "$HOME/.npm/_logs/"*.log; exit 1)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: playwright-report, path: web/playwright-report, retention-days: 7}
