name: Web

# The Next.js surface in web/. Scoped with paths so a change to the Python
# pipeline does not spend CI minutes rebuilding a frontend it cannot affect.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: web

# Deliberately runs with no Supabase secrets. Every check here has to pass on a
# clone with nothing configured, which is also the guarantee that someone can
# get the app running before they have credentials.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Type safety
        run: npx tsc --noEmit
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: playwright-report, path: web/playwright-report, retention-days: 7}
